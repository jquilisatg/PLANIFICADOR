<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Planificador</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4f91">
<style>
:root{--bg:#f4f6f8;--sf:#fff;--s2:#eef1f5;--fg:#1b2430;--mu:#6b7686;--bd:#dfe3e9;--ac:#1d4f91;--we:#eceff3}
@media(prefers-color-scheme:dark){:root{--bg:#12161b;--sf:#1a2027;--s2:#232b34;--fg:#e7ebf0;--mu:#93a0b0;--bd:#2c3540;--ac:#4f8fe0;--we:#20272f}}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;font:14px/1.4 "Segoe UI",Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--sf);border-bottom:1px solid var(--bd)}
.br{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:6px}.br i{width:22px;height:22px;border-radius:6px;background:var(--ac)}
button,input,select{font:inherit;color:inherit;background:var(--sf);border:1px solid var(--bd);border-radius:8px;padding:6px 11px}
button{cursor:pointer}button:hover{background:var(--s2)}
.sg{display:flex}.sg button{border-radius:0;margin-left:-1px}.sg button:first-child{border-radius:8px 0 0 8px;margin:0}.sg button:last-child{border-radius:0 8px 8px 0}
button.on,button.pri{background:var(--ac);border-color:var(--ac);color:#fff}
#title{flex:1;font-weight:600;font-size:15px;min-width:150px}#st{color:var(--mu);font-size:12px}
main{flex:1;overflow:auto;padding:10px 14px}
.m{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.h{text-align:center;color:var(--mu);padding:6px 0;font-size:12px;font-weight:600;border-bottom:1px solid var(--bd);background:var(--s2)}
.d{border-right:1px solid var(--bd);border-bottom:1px solid var(--bd);min-height:104px;padding:4px;cursor:pointer;min-width:0}
.d:nth-child(7n){border-right:0}.d.we{background:var(--we)}.d.o{opacity:.5}.d.w{min-height:60vh}
.d b{display:inline-block;font-size:12px;color:var(--mu);min-width:22px;height:22px;line-height:22px;text-align:center;border-radius:11px}
.d.t b{background:var(--ac);color:#fff}
.c{display:block;color:#fff;border-radius:5px;padding:2px 6px;margin:2px 0;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.gw{position:relative;background:var(--sf);border:1px solid var(--bd)}
.gm{display:flex;height:16px;font-size:11px;font-weight:600;color:var(--mu)}.gmm{overflow:hidden;white-space:nowrap;padding-left:4px;border-left:1px solid var(--bd)}
.gr{display:flex;height:30px;border-bottom:1px solid var(--bd)}.gd{height:28px;background:var(--s2)}
.gl{width:160px;flex:none;position:sticky;left:0;z-index:2;background:var(--sf);padding:0 8px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:29px;cursor:pointer;border-right:1px solid var(--bd)}
.gd .gl,.gm .gl{background:var(--s2)}.dot{display:inline-block;width:8px;height:8px;border-radius:4px;margin-right:6px}
.gc{width:30px;flex:none;text-align:center;font-size:10px;line-height:12px;padding-top:2px;color:var(--mu);border-left:1px solid var(--bd)}
.gc.we{background:var(--we)}.gc.tdy{background:var(--ac);color:#fff}
.gt{position:relative;height:100%;background:repeating-linear-gradient(90deg,var(--bd) 0 1px,transparent 1px 30px),repeating-linear-gradient(90deg,transparent 0 150px,var(--we) 150px 210px)}
.gb{touch-action:none;position:absolute;top:5px;height:20px;border-radius:5px;color:#fff;font-size:11px;line-height:20px;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.gb.ms{width:16px;height:16px;top:7px;padding:0;border-radius:3px;transform:rotate(45deg)}
.rz{position:absolute;top:0;bottom:0;width:8px;cursor:ew-resize}.rz.l{left:0}.rz.r{right:0}
.hy{position:absolute;top:0;bottom:0;width:2px;background:#d33;pointer-events:none}
.gw svg{position:absolute;left:160px;top:44px;pointer-events:none;overflow:hidden}
dialog{background:var(--sf);color:var(--fg);border:1px solid var(--bd);border-radius:12px;width:min(94vw,470px);padding:18px}
dialog::backdrop{background:rgba(0,0,0,.4)}dialog h3{margin:0 0 4px}
dialog label{display:block;margin:10px 0 3px;color:var(--mu);font-size:12px;font-weight:600}
dialog input,dialog select{width:100%}.g2{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.ck{display:flex!important;gap:6px;align-items:center;padding-bottom:7px}.ck input{width:auto}
.r{display:flex;gap:6px;margin:4px 0}.r input[type=color]{width:46px;padding:2px;flex:none}.r .dl{width:64px;flex:none}.r .dp,.r .dt{flex:1;min-width:0}
.bt{display:flex;gap:6px;margin-top:16px;justify-content:flex-end}small{color:var(--mu);display:block;margin-top:6px}
@media print{:root{--bg:#fff;--sf:#fff;--fg:#1b2430;--mu:#6b7686;--bd:#dfe3e9;--s2:#eef1f5;--we:#eceff3}header button,#st{display:none}body{display:block;height:auto}main{overflow:visible}main.vg>div{zoom:.52}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{size:landscape;margin:8mm}}
</style></head><body>
<header>
 <div class="br"><i></i>Planificador</div>
 <div class="sg"><button data-v="m">Mes</button><button data-v="w">Semana</button><button data-v="g">Gantt</button></div>
 <div class="sg"><button id="pv">‹</button><button id="td">Hoy</button><button id="nx">›</button></div>
 <span id="title"></span><span id="st"></span>
 <button class="pri" id="nw">+ Tarea</button><button id="pr" title="Imprimir o guardar como PDF">PDF</button><button id="cl" title="Sincronizar con Google Drive">☁</button><button id="cg" title="Ajustes">⚙</button>
</header>
<main></main>

<dialog id="ed">
 <h3>Tarea</h3>
 <label>Nombre</label><input id="fn">
 <div class="g2"><div><label>Tipo</label><select id="ft"></select></div><label class="ck"><input type="checkbox" id="fm"> Hito</label></div>
 <div class="g3"><div><label>Inicio</label><input id="fs" type="date"></div><div id="fE"><label>Fin</label><input id="fe" type="date"></div><div id="fD"><label>Duración (días lab.)</label><input id="fd" type="number" min="1"></div></div>
 <label>Predecesoras</label><div id="fl"></div><button id="ap">+ Añadir predecesora</button>
 <small>Desfase en días laborables: positivo = retraso, negativo = adelanto. Los fines de semana no cuentan.</small>
 <div class="bt"><button id="del">Borrar</button><button id="cx">Cancelar</button><button class="pri" id="ok">Guardar</button></div>
</dialog>

<dialog id="sd">
 <h3>Ajustes</h3><label>Tipos de tarea</label><div id="tl"></div>
 <button id="addt">+ Añadir tipo</button>
 <label>Client ID de Google (sincronización con Drive)</label><input id="cid" placeholder="xxxx.apps.googleusercontent.com">
 <div class="bt"><button id="ex">Exportar</button><button id="im">Importar</button><button class="pri" id="sx">Cerrar</button></div>
 <input id="imf" type="file" accept=".json" hidden>
</dialog>

<script>
const $=s=>document.querySelector(s),K='plan_v1',W=30,N=56;
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const pd=s=>new Date(s+'T00:00'),add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const mon=d=>add(d,-((d.getDay()+6)%7)),diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const esc=s=>String(s).replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';'),cap=s=>s[0].toUpperCase()+s.slice(1);
const isW=d=>d.getDay()%6==0;
const nw=s=>{let d=pd(s);while(isW(d))d=add(d,1);return iso(d)},pw=s=>{let d=pd(s);while(isW(d))d=add(d,-1);return iso(d)};
const addW=(s,n)=>{let d=pd(s),k=n<0?-1:1;n=Math.abs(n);while(n>0){d=add(d,k);if(!isW(d))n--}return iso(d)};
const cnt=(a,b)=>{let n=0;for(let d=pd(a);iso(d)<=b;d=add(d,1))if(!isW(d))n++;return Math.max(1,n)};
const dur=t=>t.ms?1:cnt(t.start,t.end);
const TY=[['FS','Fin → Comienzo'],['SS','Comienzo → Comienzo'],['FF','Fin → Fin'],['SF','Comienzo → Fin']];
function norm(d){d.tasks.forEach(t=>{if(t.dep&&!t.deps)t.deps=[{id:t.dep,type:'FS',lag:0}];delete t.dep;t.start=nw(t.start);t.end=t.ms?t.start:pw(t.end);if(t.end<t.start)t.end=t.start});return d}
function req(t){let r=null;(t.deps||[]).forEach(k=>{const p=D.tasks.find(x=>x.id==k.id);if(!p)return;const d=dur(t),L=+k.lag||0,T=k.type;let s;
 if(T=='FS')s=addW(p.end,1+L);else if(T=='SS')s=addW(p.start,L);else s=addW(addW(T=='FF'?p.end:p.start,L),-(d-1));
 if(!r||s>r)r=s});return r}
function fix(){for(let k=0;k<=D.tasks.length;k++){let ch=0;D.tasks.forEach(t=>{const r=req(t);if(r&&t.start<r){const n=dur(t);t.start=r;t.end=t.ms?r:addW(r,n-1);ch=1}});if(!ch)break}}
function dependsOn(a,b,seen={}){const t=D.tasks.find(x=>x.id==a);if(!t||seen[a])return false;seen[a]=1;return(t.deps||[]).some(k=>k.id==b||dependsOn(k.id,b,seen))}
let D=JSON.parse(localStorage.getItem(K)||'null')||{updated:0,types:[{id:'t1',name:'General',color:'#2b6cb0'},{id:'t2',name:'Importante',color:'#c2410c'},{id:'t3',name:'Reunión',color:'#2f855a'}],tasks:[]};
D=norm(D);fix();
let cfg=JSON.parse(localStorage.getItem('plan_cfg')||'{}'),V='m',cur=new Date(),tok=null,tc=null,timer,eid=null,cd=[];
const col=t=>(D.types.find(x=>x.id===t)||D.types[0]||{color:'#888'}).color,st=t=>$('#st').textContent=t;
function save(touch=true){if(touch)D.updated=Date.now();localStorage.setItem(K,JSON.stringify(D));if(touch){clearTimeout(timer);timer=setTimeout(sync,1500)}}

function chips(s){if(isW(pd(s)))return'';return D.tasks.filter(t=>t.start<=s&&s<=t.end).map(t=>`<span class="c" style="background:${col(t.type)}" data-e="${t.id}">${t.ms?'◆ ':''}${esc(t.name)}</span>`).join('')}
function grid(f,n,mm){const td=iso(new Date());let h='<div class="m">'+['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'].map(x=>`<div class="h">${x}</div>`).join('');
 for(let i=0;i<n;i++){const d=add(f,i),s=iso(d);h+=`<div class="d${isW(d)?' we':''}${mm!=null&&d.getMonth()!=mm?' o':''}${s==td?' t':''}${V=='w'?' w':''}" data-n="${s}"><b>${d.getDate()}</b>${chips(s)}</div>`}
 return h+'</div>'}
function gantt(f){const fs=iso(f),td=diff(fs,iso(new Date()))*W,L=[...D.tasks].sort((a,b)=>a.start<b.start?-1:a.start>b.start?1:0),ix={};L.forEach((t,i)=>ix[t.id]=i);
 let mh='',cm=-1,cn=0,cl='',dh='';
 for(let i=0;i<N;i++){const d=add(f,i);if(d.getMonth()!=cm){if(cn)mh+=`<div class="gmm" style="width:${cn*W}px">${cl}</div>`;cm=d.getMonth();cn=0;cl=cap(d.toLocaleDateString('es',{month:'long',year:'numeric'}))}cn++;
  dh+=`<div class="gc${isW(d)?' we':''}${i==td/W?' tdy':''}">${'DLMXJVS'[d.getDay()]}<br>${d.getDate()}</div>`}
 mh+=`<div class="gmm" style="width:${cn*W}px">${cl}</div>`;
 let h=`<div class="gw" style="width:${160+N*W}px"><div class="gm"><div class="gl"></div>${mh}</div><div class="gr gd"><div class="gl"></div>${dh}</div>`;
 L.forEach(t=>{const x=diff(fs,t.start)*W,n=dur(t),bg=col(t.type);h+=`<div class="gr"><div class="gl" data-e="${t.id}"><i class="dot" style="background:${bg}"></i>${esc(t.name)}</div><div class="gt" style="width:${N*W}px">${td>=0&&td<N*W?`<i class="hy" style="left:${td+W/2}px"></i>`:''}${t.ms?`<div class="gb ms" data-e="${t.id}" style="background:${bg};left:${x+W/2-8}px"></div>`:`<div class="gb" data-e="${t.id}" style="background:${bg};left:${x}px;width:${(diff(t.start,t.end)+1)*W}px"><span class="rz l"></span>${n} d<span class="rz r"></span></div>`}</div></div>`});
 const ax=(t,e)=>t.ms?(diff(fs,t.start)+.5)*W:(e?diff(fs,t.end)+1:diff(fs,t.start))*W;
 h+=`<svg width="${N*W}" height="${L.length*30}" fill="none" stroke="#7a8696" stroke-width="1.4">`;
 L.forEach(t=>(t.deps||[]).forEach(k=>{const p=D.tasks.find(x=>x.id==k.id);if(!p)return;const T=k.type,x1=ax(p,T[0]=='F'),x2=ax(t,T[1]=='F'),y1=ix[p.id]*30+15,y2=ix[t.id]*30+15,a=x1+(T[0]=='F'?8:-8),sg=x2>=a?1:-1;
  h+=`<path d="M${x1} ${y1}H${a}V${y2}H${x2}"/><path d="M${x2} ${y2}l${-5*sg} -3v6z" fill="#7a8696"/>`}));
 return h+'</svg></div>'}
function render(){
 document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==V));
 const m=$('main'),f=mon(cur),fmt=(d,o)=>d.toLocaleDateString('es',o);let t;m.className='v'+V;
 if(V=='m'){const p=new Date(cur.getFullYear(),cur.getMonth(),1);t=cap(fmt(p,{month:'long',year:'numeric'}));m.innerHTML=grid(mon(p),42,cur.getMonth())}
 else{t=fmt(f,{day:'numeric',month:'short'})+' – '+fmt(add(f,V=='w'?6:N-1),{day:'numeric',month:'short',year:'numeric'});m.innerHTML=V=='w'?grid(f,7):gantt(f)}
 $('#title').textContent=t}
function nav(k){cur=V=='m'?new Date(cur.getFullYear(),cur.getMonth()+k,1):add(cur,k*(V=='w'?7:28));render()}

function depRow(k){return`<div class="r"><select class="dp">${cd.map(x=>`<option value="${x.id}"${x.id==k.id?' selected':''}>${esc(x.name)}</option>`).join('')}</select><select class="dt">${TY.map(y=>`<option value="${y[0]}"${y[0]==k.type?' selected':''}>${y[1]}</option>`).join('')}</select><input class="dl" type="number" value="${k.lag||0}" title="Retraso (+) o adelanto (−)"><button class="rm">✕</button></div>`}
function openEd(id,s){const d0=nw(s||iso(new Date())),t=id?D.tasks.find(x=>x.id==id):{name:'',type:D.types[0].id,start:d0,end:d0};eid=id;
 $('#fn').value=t.name;$('#ft').innerHTML=D.types.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('');$('#ft').value=t.type;
 $('#fm').checked=!!t.ms;$('#fE').hidden=$('#fD').hidden=!!t.ms;
 $('#fs').value=t.start;$('#fe').value=t.end;$('#fd').value=dur(t);$('#del').hidden=!id;
 cd=D.tasks.filter(x=>x.id!=id&&!dependsOn(x.id,id));$('#fl').innerHTML=(t.deps||[]).filter(k=>cd.some(x=>x.id==k.id)).map(depRow).join('');$('#ap').hidden=!cd.length;$('#ed').showModal()}
function setEnd(){if(!$('#fs').value)return;if($('#fm').checked){$('#fe').value=$('#fs').value;return}const n=Math.max(1,+$('#fd').value||1);$('#fd').value=n;$('#fe').value=addW($('#fs').value,n-1)}
$('#fs').onchange=()=>{if(!$('#fs').value)return;$('#fs').value=nw($('#fs').value);setEnd()};$('#fd').onchange=setEnd;
$('#fe').onchange=()=>{let e=pw($('#fe').value);if(e<$('#fs').value)e=$('#fs').value;$('#fe').value=e;$('#fd').value=cnt($('#fs').value,e)};
$('#fm').onchange=()=>{$('#fE').hidden=$('#fD').hidden=$('#fm').checked;$('#fd').value=1;setEnd()};
$('#ap').onclick=()=>$('#fl').insertAdjacentHTML('beforeend',depRow({id:cd[0].id,type:'FS',lag:0}));
$('#fl').onclick=e=>{if(e.target.classList.contains('rm'))e.target.parentNode.remove()};
$('#ok').onclick=()=>{if(!$('#fs').value)return;const ms=$('#fm').checked,s=nw($('#fs').value),e=ms?s:pw($('#fe').value);
 const t={id:eid||'k'+Date.now(),name:$('#fn').value||'Tarea',type:$('#ft').value,start:s,end:e<s?s:e,deps:[...document.querySelectorAll('#fl .r')].map(r=>({id:r.querySelector('.dp').value,type:r.querySelector('.dt').value,lag:+r.querySelector('.dl').value||0}))};
 if(ms)t.ms=1;if(eid)D.tasks[D.tasks.findIndex(x=>x.id==eid)]=t;else D.tasks.push(t);fix();$('#ed').close();save();render()};
$('#del').onclick=()=>{D.tasks=D.tasks.filter(x=>x.id!=eid);D.tasks.forEach(t=>t.deps=(t.deps||[]).filter(k=>k.id!=eid));$('#ed').close();save();render()};
$('#cx').onclick=()=>$('#ed').close();

function openSet(){$('#cid').value=cfg.cid||'';$('#tl').innerHTML=D.types.map((x,i)=>`<div class="r"><input type="color" value="${x.color}" data-i="${i}" data-k="color"><input value="${esc(x.name)}" data-i="${i}" data-k="name"><button data-x="${i}">✕</button></div>`).join('');$('#sd').showModal()}
$('#tl').oninput=e=>{const i=e.target.dataset.i;if(i!=null){D.types[i][e.target.dataset.k]=e.target.value;save();render()}};
$('#tl').onclick=e=>{const i=e.target.dataset.x;if(i!=null&&D.types.length>1){D.types.splice(i,1);save();openSet();render()}};
$('#addt').onclick=()=>{D.types.push({id:'t'+Date.now(),name:'Nuevo tipo',color:'#7048e8'});save();openSet()};
$('#cid').onchange=()=>{cfg.cid=$('#cid').value.trim();localStorage.setItem('plan_cfg',JSON.stringify(cfg));tc=null};
$('#sx').onclick=()=>$('#sd').close();
$('#ex').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));a.download='planificador.json';a.click()};
$('#im').onclick=()=>$('#imf').click();
$('#imf').onchange=e=>{const r=new FileReader();r.onload=()=>{try{D=norm(JSON.parse(r.result));fix();save();render();openSet()}catch(x){alert('Archivo no válido')}};r.readAsText(e.target.files[0])};

const API='https://www.googleapis.com/drive/v3/files',UP='https://www.googleapis.com/upload/drive/v3/files';
const loadJs=src=>new Promise(r=>{const s=document.createElement('script');s.src=src;s.onload=r;document.head.appendChild(s)});
async function connect(){if(!cfg.cid){openSet();return}
 if(!window.google)await loadJs('https://accounts.google.com/gsi/client');
 tc=tc||google.accounts.oauth2.initTokenClient({client_id:cfg.cid,scope:'https://www.googleapis.com/auth/drive.appdata',callback:r=>{if(r.access_token){tok=r.access_token;sync()}}});
 tc.requestAccessToken()}
async function sync(){if(!tok||!navigator.onLine)return;const h={Authorization:'Bearer '+tok};
 try{const r=await fetch(API+"?spaces=appDataFolder&fields=files(id)&q=name%3D'plan.json'",{headers:h});
  if(r.status==401){tok=null;st('Pulsa ☁ para reconectar');return}
  const id=((await r.json()).files||[])[0]?.id;
  if(id){const rd=await(await fetch(API+'/'+id+'?alt=media',{headers:h})).json();
   if(rd.updated>D.updated){D=norm(rd);fix();save(false);render();st('☁ actualizado');return}
   if(rd.updated==D.updated){st('☁ al día');return}}
  const body=JSON.stringify(D);
  if(id)await fetch(UP+'/'+id+'?uploadType=media',{method:'PATCH',headers:{...h,'Content-Type':'application/json'},body});
  else await fetch(UP+'?uploadType=multipart',{method:'POST',headers:{...h,'Content-Type':'multipart/related; boundary=x'},body:'--x\r\nContent-Type: application/json\r\n\r\n'+JSON.stringify({name:'plan.json',parents:['appDataFolder']})+'\r\n--x\r\nContent-Type: application/json\r\n\r\n'+body+'\r\n--x--'});
  st('☁ guardado')}catch(e){st('Sin conexión')}}
$('#cl').onclick=connect;
setInterval(sync,60000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});

document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{V=b.dataset.v;render()});
$('#pv').onclick=()=>nav(-1);$('#nx').onclick=()=>nav(1);$('#td').onclick=()=>{cur=new Date();render()};
$('#nw').onclick=()=>openEd();$('#cg').onclick=openSet;$('#pr').onclick=()=>window.print();
let drg=false;
